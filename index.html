<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>American Accent Speaker</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --text: #1f2937;
        --muted: #6b7280;
        --shadow: rgba(37, 99, 235, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef4ff, var(--bg));
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        padding: 16px;
      }

      .card {
        width: min(100%, 560px);
        background: var(--card);
        border-radius: 20px;
        box-shadow: 0 20px 45px var(--shadow);
        padding: 24px 18px;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(1.5rem, 6vw, 2.4rem);
        text-align: center;
        line-height: 1.2;
      }

      .input-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #f8fafc;
        border: 1px solid #dbe3f0;
        border-radius: 12px;
        padding: 10px 12px;
      }

      input[type="text"] {
        flex: 1;
        width: 100%;
        min-width: 0;
        border: none;
        background: transparent;
        font-size: 1rem;
        color: var(--text);
        outline: none;
      }

      button {
        border: none;
        background: var(--primary);
        color: white;
        width: 48px;
        height: 48px;
        min-width: 48px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1.35rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s ease, background 0.2s ease;
        box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25);
      }

      button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      .status {
        margin-top: 14px;
        min-height: 22px;
        font-size: 0.9rem;
        color: var(--muted);
        text-align: center;
        word-break: break-word;
      }

      @media (max-width: 480px) {
        .card {
          padding: 20px 14px;
          border-radius: 16px;
        }

        .input-wrap {
          align-items: stretch;
          flex-direction: column;
          padding: 12px;
        }

        input[type="text"] {
          font-size: 1.05rem;
          padding: 8px 0;
        }

        button {
          width: 100%;
          height: 46px;
          border-radius: 10px;
          font-size: 1.2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="input-wrap">
        <input id="textInput" type="text" />
        <button id="speakBtn" aria-label="Speak text" title="Speak">🔊</button>
      </div>

      <div class="status" id="statusText">Ready to speak</div>
    </div>

    <script>
      const textInput = document.getElementById('textInput');
      const speakBtn = document.getElementById('speakBtn');
      const statusText = document.getElementById('statusText');

      function getAmericanVoice() {
        const voices = window.speechSynthesis.getVoices();

        const preferred = voices.find((voice) =>
          /en-us|us english|american/i.test(voice.name) || voice.lang === 'en-US'
        );

        return preferred || voices.find((voice) => voice.lang.startsWith('en')) || null;
      }

      function speakText() {
        const text = textInput.value.trim();

        if (!text) {
          statusText.textContent = 'Please enter some text first.';
          textInput.focus();
          return;
        }

        if (!('speechSynthesis' in window)) {
          statusText.textContent = 'Speech synthesis is not supported in this browser.';
          return;
        }

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        const voice = getAmericanVoice();

        if (voice) {
          utterance.voice = voice;
        }

        utterance.lang = 'en-US';
        utterance.rate = 1;
        utterance.pitch = 1;
        utterance.volume = 1;

        utterance.onstart = () => {
          statusText.textContent = 'Speaking...';
        };

        utterance.onend = () => {
          statusText.textContent = 'Done speaking';
        };

        utterance.onerror = () => {
          statusText.textContent = 'There was an issue while speaking.';
        };

        window.speechSynthesis.speak(utterance);
      }

      speakBtn.addEventListener('click', speakText);
      textInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          speakText();
        }
      });

      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          const voice = getAmericanVoice();
          if (voice) {
            statusText.textContent = '⬆️';
          }
        };
      }
    </script>
  </body>
</html>
